[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-edge"
version = "1.0.0"
description = "Agentic AI assistant system optimized for edge"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Framework
    "strands-agents[otel] @ git+https://github.com/westonbrown/sdk-python.git@main",

    # Configuration & Environment
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "pytz>=2023.3,<2025.0",

    # Web & API
    "requests>=2.31.0,<3.0.0",
    "httpx>=0.24.0,<1.0.0",
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn[standard]>=0.23.0,<1.0.0",

    # AWS Integration
    "aws-requests-auth>=0.4.3,<0.5.0",
    "boto3>=1.28.0,<2.0.0",

    # Data Processing
    "pydantic>=2.0.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "orjson>=3.9.0,<4.0.0",

    # Content Processing
    "markdownify>=0.11.0,<1.0.0",
    "readabilipy>=0.2.0,<1.0.0",

    # Observation
    "aws-opentelemetry-distro~=0.10.1",

    # System & Utilities
    "psutil>=5.9.0,<8.0.0",
    "py-cpuinfo>=9.0.0,<10.0.0",
    "sympy>=1.12.0,<2.0.0",
    "rich>=13.7.0,<14.0.0",
    "huggingface-hub[cli]>=0.34.4,<1.0.0",
]

[project.optional-dependencies]
# Development Tools
dev = [
    # Testing
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-html>=3.2.0,<5.0.0",
    "pytest-xdist>=3.3.0,<4.0.0",
    "pytest-mock>=3.11.0,<4.0.0",
    "pytest-timeout>=2.1.0,<3.0.0",

    # Code Quality
    "black>=24.0.0,<25.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.5.0,<2.0.0",
    "isort>=5.12.0,<6.0.0",

    # Documentation
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-material>=9.0.0,<10.0.0",
]

# Audio Processing
audio = [
    "sounddevice>=0.4.6,<1.0.0",
    "soundfile>=0.12.0,<1.0.0",
    "scipy>=1.11.0,<2.0.0",
]

# Edge Deployment Optimizations
edge = [
    "uvloop>=0.19.0,<1.0.0",
]

# Machine Learning Core
ml = [
    "faiss-cpu>=1.7.4,<2.0.0",
    "sentence-transformers>=2.2.0,<4.0.0",
    "ipykernel>=6.0.0,<7.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.7.0,<4.0.0",
]

# ASR Fine-tuning (Whisper)
asr = [
    # Core ML Framework
    "torch>=2.8.0,<3.0.0",
    "torchaudio>=2.8.0,<3.0.0",
    "transformers>=4.53.0,<5.0.0",
    "datasets>=2.18.0,<4.0.0",
    "accelerate>=1.0.0,<2.0.0",
    "peft>=0.12.0,<1.0.0",

    # Audio Processing
    "librosa>=0.10.1,<1.0.0",
    "soundfile>=0.12.1,<1.0.0",
    "audioread>=3.0.0,<4.0.0",
    "pydub>=0.25.0,<1.0.0",

    # Evaluation & Metrics
    "evaluate>=0.4.1,<1.0.0",
    "jiwer>=3.0.3,<4.0.0",

    # Visualization & Monitoring
    "matplotlib>=3.7.0,<4.0.0",
    "tensorboard>=2.14.0,<3.0.0",
]

# Function Calling Fine-tuning (Qwen3)
function-calling = [
    # Core ML Framework
    "torch>=2.8.0,<3.0.0",
    "torchvision>=0.23.0,<1.0.0",
    "transformers>=4.53.0,<5.0.0",
    "datasets>=2.18.0,<4.0.0",
    "accelerate>=1.0.0,<2.0.0",
    "peft>=0.12.0,<1.0.0",

    # Model Conversion & Serialization
    "gguf>=0.7.0,<1.0.0",
    "safetensors>=0.4.3,<1.0.0",
    "sentencepiece>=0.2.0,<1.0.0",
    "protobuf==6.32.0",

    # GPU Acceleration
    "triton>=3.0.0,<4.0.0",

    # Utilities & Evaluation
    "matplotlib>=3.7.0,<4.0.0",
    "mistral-common>=1.8.3,<2.0.0",
    "psutil>=5.9.0,<8.0.0",
    "requests>=2.31.0,<3.0.0",
    "boto3>=1.28.0,<2.0.0",
]

# Complete Installation
all = [
    "agentic-ai-edge[dev,audio,edge,ml,asr,function-calling]",
]

[project.scripts]
agentic-ai = "main:main"
agentic-ai-api = "main:run_api_server"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"*" = [
    "*.json",
    "*.yaml",
    "*.yml",
    "*.npy",
    "*.index",
    "data/vehicle_knowledge/data/*",
    "utils/*",
    "py.typed",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.coverage.html]
directory = "htmlcov"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "slow: Slow tests (>5 seconds)",
    "requires_model: Tests requiring AI model availability",
    "requires_audio: Tests requiring audio hardware",
    "requires_gpu: Tests requiring GPU acceleration",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
norecursedirs = [".git", ".tox", "dist", "build", "*.egg"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # function calls in argument defaults
    "W191",  # indentation contains tabs
    "B905",  # zip() without explicit strict parameter
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]
